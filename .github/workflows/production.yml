name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write # para publicar los resultados de las pruebas

env:
  DEV_URL: https://inventorylite.federico-zaragoza.workers.dev
  PROD_URL: https://inventorylite-prod.federico-zaragoza.workers.dev

jobs:
  # ── 1. Build + pruebas unitarias + coverage ─────────────────────────
  build-test:
    name: Build, Unit Tests y Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias + coverage
        run: npm run test:coverage

      - name: Publicar resultados de pruebas unitarias
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados - Pruebas unitarias
          path: reports/junit-unit.xml
          reporter: java-junit

      - name: Resumen de coverage
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`;
            console.log(["## Coverage", "| Métrica | % | Cubierto |", "| --- | --- | --- |",
              ...["statements","branches","functions","lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reportes (JUnit + coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-unit
          path: |
            reports/
            coverage/
          retention-days: 7

      - name: Build desarrollo
        run: npm run build && mv dist dist-dev

      - name: Build producción
        run: npm run build:prod

      - name: Subir artifact del build
        uses: actions/upload-artifact@v4
        with:
          name: inventorylite-dist
          path: |
            dist/
            dist-dev/
          retention-days: 7

  # ── 2. Deploy al ambiente de desarrollo ─────────────────────────────
  deploy-dev:
    name: Deploy a desarrollo
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: development
      url: ${{ env.DEV_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Descargar artifact del build
        uses: actions/download-artifact@v4
        with:
          name: inventorylite-dist

      - name: Crear/actualizar tabla en D1 de desarrollo
        run: npx wrangler d1 execute inventorylite-db --remote --file=./schema.sql

      - name: Deploy con Wrangler (desarrollo)
        run: npx wrangler deploy --config dist-dev/inventorylite/wrangler.json

  # ── 3. UAT automatizado contra desarrollo ───────────────────────────
  uat:
    name: UAT (pruebas de aceptación)
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Esperar a que la app de desarrollo responda
        run: |
          for i in $(seq 1 20); do
            if curl -sf "$DEV_URL/api/products" > /dev/null; then echo "Disponible"; exit 0; fi
            echo "Intento $i: aún no responde, esperando..."; sleep 6
          done
          echo "La app de desarrollo no respondió"; exit 1

      - name: Ejecutar UAT
        run: npm run test:uat
        env:
          UAT_BASE_URL: ${{ env.DEV_URL }}

      - name: Publicar resultados UAT
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados - UAT
          path: reports/junit-uat.xml
          reporter: java-junit

      - name: Subir reporte UAT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-uat
          path: reports/junit-uat.xml
          retention-days: 7

  # ── 4. Deploy a producción (solo si el UAT pasa) ────────────────────
  deploy-production:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: uat
    environment:
      name: production
      url: ${{ env.PROD_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Descargar artifact del build
        uses: actions/download-artifact@v4
        with:
          name: inventorylite-dist

      - name: Crear/actualizar tabla en D1 de producción
        run: npx wrangler d1 execute inventorylite-db-prod --env production --remote --file=./schema.sql

      - name: Deploy con Wrangler (producción)
        run: npx wrangler deploy --config dist/inventorylite/wrangler.json

      - name: Smoke test de producción
        run: curl -sf "$PROD_URL/api/products" > /dev/null && echo "Producción OK"
