name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build, Tests y Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build (producción)
        run: npm run build:prod

      - name: Subir artifact del build
        uses: actions/upload-artifact@v4
        with:
          name: inventorylite-dist
          path: dist/
          retention-days: 7

      - name: Subir reporte de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  deploy-production:
    name: Deploy a Cloudflare (producción)
    runs-on: ubuntu-latest
    needs: build-test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar artifact del build
        uses: actions/download-artifact@v4
        with:
          name: inventorylite-dist
          path: dist/

      - name: Crear/actualizar tabla en D1 de producción
        run: npx wrangler d1 execute inventorylite-db-prod --env production --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy con Wrangler
        run: npx wrangler deploy --config dist/inventorylite/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}